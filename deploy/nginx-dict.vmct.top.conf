# Nginx vhost for the standalone dictionary frontend.
# The certificate is shared with the ECS site and must cover dict.vmct.top.
server {
    listen 80;
    listen [::]:80;
    server_name dict.vmct.top;

    return 301 https://dict.vmct.top$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dict.vmct.top;

    ssl_certificate /etc/letsencrypt/live/vmct.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vmct.top/privkey.pem;

    # Fixed upstream: convert the URL-encoded q argument to its POST form.
    location = /api/mcmod {
        if ($request_method != GET) { return 405; }
        if ($arg_q = "") { return 400; }
        # Accept only form-safe encoded characters; prevent parameter injection.
        if ($arg_q !~ "^(?:[A-Za-z0-9_.~+*-]|%[0-9A-Fa-f]{2}){1,450}$") { return 400; }

        proxy_pass https://dict.mcmod.cn/connection/search.php?;
        proxy_method POST;
        proxy_set_body "key=$arg_q&max=100&range=1";
        proxy_pass_request_headers off;
        proxy_set_header Host dict.mcmod.cn;
        proxy_set_header Content-Type application/x-www-form-urlencoded;
        proxy_set_header Accept text/html;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Referer https://dict.mcmod.cn/;
        proxy_set_header Origin https://dict.mcmod.cn;
        proxy_set_header X-Requested-With XMLHttpRequest;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_send_timeout 8s;
        proxy_read_timeout 8s;
        proxy_redirect off;
        proxy_hide_header Content-Type;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Cache-Control no-store always;
        add_header X-Mcmod-Request-Id $request_id always;
    }

    location /api/ {
        proxy_pass http://172.17.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 60s;
        proxy_no_cache 1;
    }

    location = /search {
        proxy_pass http://172.17.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_no_cache 1;
    }

    location /assets/ {
        root /home/vmct/vmpm/dist/dict.vmct.top;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        root /home/vmct/vmpm/dist/dict.vmct.top;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}