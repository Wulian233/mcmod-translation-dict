# Nginx vhost for the standalone dictionary frontend.
# The certificate is shared with the ECS site and must cover dict.vmct.top.
server {
    listen 80;
    listen [::]:80;
    server_name dict.vmct.top;

    return 301 https://dict.vmct.top$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dict.vmct.top;

    ssl_certificate /etc/letsencrypt/live/vmct.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vmct.top/privkey.pem;

    location /api/ {
        proxy_pass http://172.17.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 60s;
        proxy_no_cache 1;
    }

    location = /search {
        proxy_pass http://172.17.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_no_cache 1;
    }

    location /assets/ {
        root /home/vmct/vmpm/dist/dict.vmct.top;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        root /home/vmct/vmpm/dist/dict.vmct.top;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}